<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开学倒计时</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
    color: #f5f7ff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(160deg, #0b1026 0%, #1a1f4d 40%, #2d1b5e 75%, #0d0b2e 100%);
    background-attachment: fixed;
    overflow: hidden;
    position: relative;
  }

  /* 背景装饰光晕 */
  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    z-index: 0;
  }

  body::before {
    width: 520px;
    height: 520px;
    top: -160px;
    right: -120px;
    background: rgba(120, 90, 255, 0.35);
  }

  body::after {
    width: 460px;
    height: 460px;
    bottom: -140px;
    left: -100px;
    background: rgba(60, 160, 255, 0.28);
  }

  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px 30px;
    border-radius: 28px;
    background: rgba(15, 18, 45, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(6px);
    max-width: 92vw;
  }

  .title {
    font-size: 3.2rem;
    font-weight: 800;
    letter-spacing: 0.15em;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #7ec8ff, #c9a6ff, #7ec8ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  .subtitle {
    font-size: 1.05rem;
    color: rgba(235, 240, 255, 0.75);
    margin-bottom: 36px;
    letter-spacing: 0.08em;
  }

  .subtitle strong {
    color: #ffd76a;
    font-weight: 700;
  }

  .countdown {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 120px;
    padding: 20px 14px 14px;
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03));
    border: 1px solid rgba(255, 255, 255, 0.14);
  }

  .num {
    font-size: 4.4rem;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
    text-shadow: 0 0 26px rgba(140, 170, 255, 0.65);
  }

  .label {
    margin-top: 10px;
    font-size: 1rem;
    color: rgba(235, 240, 255, 0.65);
    letter-spacing: 0.3em;
  }

  .colon {
    font-size: 3.6rem;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.35);
    padding-bottom: 26px;
  }

  .footer {
    margin-top: 30px;
    font-size: 0.92rem;
    color: rgba(235, 240, 255, 0.55);
    letter-spacing: 0.05em;
  }

  .footer span {
    color: #9fb8ff;
  }

  @media (max-width: 560px) {
    .title { font-size: 2.2rem; }
    .num { font-size: 3rem; }
    .unit { min-width: 88px; padding: 14px 10px 10px; }
    .colon { font-size: 2.4rem; }
  }
</style>
</head>
<body>

  <div class="card">
    <h1 class="title">开学倒计时</h1>
    <p class="subtitle">距离 <strong>2026 年 9 月 12 日</strong> 开学还有</p>

    <div class="countdown">
      <div class="unit">
        <div class="num" id="days">--</div>
        <div class="label">天</div>
      </div>
      <div class="colon">:</div>
      <div class="unit">
        <div class="num" id="hours">--</div>
        <div class="label">小时</div>
      </div>
      <div class="colon">:</div>
      <div class="unit">
        <div class="num" id="minutes">--</div>
        <div class="label">分钟</div>
      </div>
      <div class="colon">:</div>
      <div class="unit">
        <div class="num" id="seconds">--</div>
        <div class="label">秒</div>
      </div>
    </div>

    <p class="footer">今天是 <span id="today">--</span></p>
  </div>

<script>
  const TARGET = new Date(2026, 8, 12, 0, 0, 0); // 2026-09-12 00:00:00（本地时区）

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function update() {
    const now = new Date();
    let diff = TARGET.getTime() - now.getTime();

    if (diff < 0) {
      document.getElementById("days").textContent = "00";
      document.getElementById("hours").textContent = "00";
      document.getElementById("minutes").textContent = "00";
      document.getElementById("seconds").textContent = "00";
      return;
    }

    const days = Math.floor(diff / 86400000);
    diff -= days * 86400000;
    const hours = Math.floor(diff / 3600000);
    diff -= hours * 3600000;
    const minutes = Math.floor(diff / 60000);
    diff -= minutes * 60000;
    const seconds = Math.floor(diff / 1000);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = pad(hours);
    document.getElementById("minutes").textContent = pad(minutes);
    document.getElementById("seconds").textContent = pad(seconds);
  }

  function showToday() {
    const now = new Date();
    const y = now.getFullYear();
    const m = now.getMonth() + 1;
    const d = now.getDate();
    document.getElementById("today").textContent = y + " 年 " + m + " 月 " + d + " 日";
  }

  update();
  showToday();
  setInterval(update, 1000);
</script>

</body>
</html>
